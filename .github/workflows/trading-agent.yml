# Runs the trading agent unattended on GitHub Actions.
#
# The cron fires every 15 minutes across the whole US trading day (in UTC, it
# covers both EDT and EST). Every firing runs scheduler/run_shared.py, which
# decides from real New York time whether to run the AM session (9:30-10:35 ET,
# the first hour after the open), the PM session (2:55-4:00 ET, into the close),
# the end-of-day report (4:10-5:00 ET, after the close), or nothing. Each session runs at most once per day, so the
# extra firings do nothing.
#
# This is the PRIMARY runner. Your PC can run the same schedule as a BACKUP
# (scripts/run_pc.bat): both go through scheduler/run_shared.py, which shares
# state via the `agent-state` branch and claims each session before trading,
# so a session never runs twice.
#
# Persistence: a fresh runner has no disk from the previous run, so:
#   - .state/ (trial clock, "ran today" markers, KILL_SWITCH), trade_log.csv,
#     TRADE_LOG.md and TRIAL_REPORT.md live on the `agent-state` branch.
#   - .cache/ (fundamentals/research/price cache that backfills the free-tier
#     quotas over several days) goes in the Actions cache.
#
# Required repo secrets: ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY,
# FMP_API_KEY, FINNHUB_API_KEY. This workflow always trades the PAPER account.
name: trading-agent

on:
  schedule:
    - cron: "7,22,37,52 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force_session:
        description: "Run this session now even outside its time window (still once a day, still all safety checks)"
        type: choice
        default: none
        options: [none, morning, afternoon, report]

permissions:
  contents: write   # push shared state to the agent-state branch
  issues: write     # post the daily and 5-day reports as issues (GitHub emails them)

concurrency:
  group: trading-agent
  cancel-in-progress: false

env:
  # Trade the whole paper account (0 = no cap), 30 positions, max 6% each.
  SP500_CAPITAL_BUDGET: "0"
  ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
  ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
  ALPACA_BASE_URL: https://paper-api.alpaca.markets
  FMP_API_KEY: ${{ secrets.FMP_API_KEY || secrets.FINANCIALMODELINGPREP }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY || secrets.FINNHUB }}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: agent-cache-${{ github.run_id }}
          restore-keys: agent-cache-

      # Manual runs ("Run workflow" button) first check every API connection.
      - name: Check API connections
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_connections.py

      - name: Run agent (shared with the PC backup runner)
        env:
          SP500_RUNNER_ROLE: primary
          SP500_RUNNER_NAME: github-actions
          SP500_FORCE_SESSION: ${{ github.event.inputs.force_session || 'none' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scheduler/run_shared.py

      # Manual runs also list recent orders and flag any this agent didn't place.
      - name: Order audit
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/order_audit.py --days 5

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 45

      - name: Save data cache
        if: always() && hashFiles('.cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache
          # Content-addressed: an unchanged cache maps to an existing key and is skipped.
          key: agent-cache-${{ hashFiles('.cache/**') }}
