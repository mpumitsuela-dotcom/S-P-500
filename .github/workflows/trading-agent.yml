# Runs the trading agent unattended on GitHub Actions.
#
# The cron fires every 15 minutes across the whole US trading day (in UTC, it
# covers both EDT and EST). Every firing runs scheduler/dispatcher.py, which
# decides from real New York time whether to run the AM session (9:30-10:35 ET,
# the first hour after the open), the PM session (2:55-4:00 ET, into the close),
# or nothing. The dispatcher runs each session at most once per day, so the
# extra firings do nothing.
#
# Persistence: a fresh runner has no disk from the previous run, so:
#   - .state/ (trial clock, "ran today" markers, KILL_SWITCH), trade_log.csv,
#     TRADE_LOG.md and TRIAL_REPORT.md are committed to the `agent-state`
#     branch after every run, and restored from it before the next one.
#   - .cache/ (fundamentals/research/price cache that backfills the free-tier
#     quotas over several days) goes in the Actions cache.
#
# Required repo secrets: ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY,
# FMP_API_KEY, FINNHUB_API_KEY. This workflow always trades the PAPER account.
name: trading-agent

on:
  schedule:
    - cron: "7,22,37,52 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-agent
  cancel-in-progress: false

env:
  STATE_BRANCH: agent-state
  STATE_PATHS: .state trade_log.csv TRADE_LOG.md TRIAL_REPORT.md
  # $10K budget: fewer, larger positions so whole-share orders still fill.
  SP500_CAPITAL_BUDGET: "10000"
  SP500_NUM_POSITIONS: "15"
  SP500_MAX_POSITION_WEIGHT: "0.08"
  ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
  ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
  ALPACA_BASE_URL: https://paper-api.alpaca.markets
  FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore agent state
        run: |
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null; then
            git fetch --depth=1 origin "$STATE_BRANCH"
            git checkout FETCH_HEAD -- .
            git rev-parse FETCH_HEAD > "$RUNNER_TEMP/state_parent"
            echo "Restored state from $STATE_BRANCH:"
            ls -la .state
          else
            echo "No $STATE_BRANCH branch yet - first run, starting fresh."
          fi

      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: agent-cache-${{ github.run_id }}
          restore-keys: agent-cache-

      # Manual runs ("Run workflow" button) first check every API connection.
      - name: Check API connections
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_connections.py

      - name: Run dispatcher
        run: python scheduler/dispatcher.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 45

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          # Content-addressed: an unchanged cache maps to an existing key and is skipped.
          key: agent-cache-${{ hashFiles('.cache/**') }}

      - name: Save agent state
        if: always()
        run: |
          # Build the commit from a private index so the main checkout is untouched.
          export GIT_INDEX_FILE="$RUNNER_TEMP/state.index"
          rm -f "$GIT_INDEX_FILE"
          for p in $STATE_PATHS; do
            [ -e "$p" ] && git add -f -- "$p"
          done
          tree=$(git write-tree)
          parent=$(cat "$RUNNER_TEMP/state_parent" 2>/dev/null || true)
          if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then
            echo "State unchanged - nothing to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -m "Agent state after run ${{ github.run_id }}")
          git push origin "$commit:refs/heads/$STATE_BRANCH"
